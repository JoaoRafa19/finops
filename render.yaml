databases:
  - name: finops-db
    plan: free
    databaseName: finops
    user: finops
    region: oregon

services:
  - type: redis
    name: finops-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction

  - type: web
    name: finops
    env: go
    region: oregon
    plan: free
    buildCommand: go build -tags netgo -ldflags '-s -w' -o app ./cmd/finops
    startCommand: ./app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finops-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: finops-redis
          type: redis
          property: connectionString

      # LLM — Groq
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_API_KEY
        sync: false  # preencher manualmente no dashboard do Render

      # App
      - key: HTTP_ADDR
        value: ":8080"
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_TTL
        value: "30m"
      - key: REMEMBER_ME_TTL
        value: "168h"
      - key: SLIDING_SESSION_TTL
        value: "true"
      - key: LOG_LEVEL
        value: "info"

      # Aplica migrations pendentes automaticamente ao startup.
      - key: MIGRATE_ON_START
        value: "true"

      # URL pública (usada em links de reset senha e verificação de e-mail)
      - key: APP_BASE_URL
        sync: false  # preencher com URL final do Render (ex: https://finops.onrender.com)

      # SMTP — envio de e-mails transacionais
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

      # Embeddings (opcional; deixar vazio desabilita busca semântica).
      # Em produção usar um provider OpenAI-compatible que suporte /v1/embeddings.
      - key: EMBEDDING_BASE_URL
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        sync: false
